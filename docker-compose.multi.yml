services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: analytiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytiq-local}
      POSTGRES_DB: analytiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment: &backend-environment
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://analytiq:${POSTGRES_PASSWORD:-analytiq-local}@postgres:5432/analytiq
      JWT_SECRET: ${JWT_SECRET:-}
      WORKER_MODE: external
      MAX_WORKERS: ${MAX_WORKERS:-2}
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - artifact-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    volumes:
      - artifact-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  artifact-data:
