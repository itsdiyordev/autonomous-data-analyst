[project]
name = "analytiq-backend"
version = "3.0.0"
description = "Autonomous analytics and deployable machine learning"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<2.5",
  "scipy>=1.13,<2",
  "defusedxml>=0.7,<1",
  "scikit-learn>=1.6,<1.9",
  "pyarrow>=19,<24",
  "openpyxl>=3.1,<4",
  "joblib>=1.4,<2",
  "shap>=0.48,<1",
  "numba>=0.61,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
